<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC Rowing Weather</title>
<meta name="description" content="Practice weather, tides, river flow and 2K race course conditions for DC-area rowing: Upper and Lower Potomac, Anacostia and Occoquan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* Same palette and type as the main page (index.html) */
  :root {
    --ink: #0b1e2d;      /* deep river navy - background */
    --ink-2: #142b3d;    /* card panel */
    --ink-3: #1b3549;    /* stat tile inside a card */
    --mist: #93a9b8;     /* muted secondary text */
    --fog: #eef2f4;      /* primary text on dark */
    --dawn: #74b0da;     /* Whitman blue accent (Pantone 542C) */
    --go: #00FF00;
    --stop: #FF0000;
    --partial: #FFA500;  /* used for storm / front flags */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--fog);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 40px;
  }

  header { text-align: center; max-width: 480px; }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dawn);
    margin: 0 0 6px;
  }

  h1 { font-size: 22px; font-weight: 500; margin: 0; color: var(--fog); }

  .sub { font-size: 13px; color: var(--mist); margin: 6px 0 0; }

  .horizon {
    width: 100%;
    max-width: 480px;
    height: 2px;
    margin: 22px 0 28px;
    background: linear-gradient(90deg, transparent, var(--dawn), transparent);
    background-size: 200% 100%;
    animation: drift 6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .horizon { animation: none; } }
  @keyframes drift {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 0%; }
  }

  main { width: 100%; max-width: 480px; }

  /* ---------- Today (main box) ---------- */
  .today-card {
    background: var(--ink-2);
    border-radius: 12px;
    border-top: 3px solid var(--dawn);
    padding: 22px 16px 20px;
  }
  .today-card.has-flag { border-top-color: var(--partial); }

  .card-head { text-align: center; }

  .label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mist);
  }

  .date { display: block; font-size: 13px; color: var(--mist); margin-top: 2px; }

  .window-note { display: block; font-size: 12px; color: var(--mist); margin-top: 4px; opacity: 0.8; }



  .stat-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mist);
  }

  .stat-value {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: 0.02em;
    margin-top: 4px;
    color: var(--fog);
    white-space: nowrap;
  }

  .stat-value .unit { font-size: 0.55em; color: var(--mist); }


  .stat-detail { display: block; font-size: 12px; color: var(--mist); margin-top: 2px; line-height: 1.4; }

  .arrow {
    display: inline-block;
    width: 0.8em;
    height: 0.8em;
    color: var(--dawn);
    flex: none;
  }

  .tag {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dawn);
    border: 1px solid rgba(116, 176, 218, 0.5);
    border-radius: 4px;
    padding: 1px 5px;
    vertical-align: middle;
  }

  /* ---------- Today: five-box layout ---------- */
  /* Phone order: Temp, Precip, Map, Race Course, Flow */
  .today-grid {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-areas: "temp" "precip" "map" "course" "flow";
    gap: 10px;
    margin-top: 18px;
  }
  .box-temp   { grid-area: temp; }
  .box-precip { grid-area: precip; }
  .box-map    { grid-area: map; }
  .box-course { grid-area: course; }
  .box-flow   { grid-area: flow; }

  .box {
    background: var(--ink-3);
    border-radius: 10px;
    padding: 16px 16px 14px;
    min-width: 0;
  }
  .box-title {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dawn);
    margin-bottom: 8px;
  }
  .pair { display: flex; flex-wrap: wrap; gap: 14px 24px; }
  .metric { flex: 1 1 120px; min-width: 0; }
  .metric .stat-value { margin-top: 2px; }
  /* "HIGH 3:31 PM" is wide, so tide and flow stack rather than share a row */
  .box-flow .metric { flex-basis: 100%; }

  .box-precip.has-flag { box-shadow: inset 0 3px 0 var(--partial); }
  .box-precip .flags { margin-top: 12px; }
  .box-precip .no-alerts { display: block; font-size: 12px; color: var(--mist); margin-top: 10px; }

  /* Label / value rows under the course rating */
  .facts { margin: 10px 0 0; }
  .facts div {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 6px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 13px;
  }
  .facts dt { color: var(--mist); flex: none; }
  .facts dd { margin: 0; color: var(--fog); font-weight: 500; text-align: right; }

  .box-course.is-fast { box-shadow: inset 0 3px 0 var(--go); }
  .box-course.is-slow { box-shadow: inset 0 3px 0 var(--stop); }
  .box-course.is-typical { box-shadow: inset 0 3px 0 var(--dawn); }

  /* Map with animated wind */
  .box-map {
    position: relative;
    padding: 0;
    overflow: hidden;
    min-height: 340px;
    background: #0d2233;
  }
  .wind-map, .wind-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wind-map { background: #0d2233; z-index: 1; }
  .wind-canvas { z-index: 2; pointer-events: none; }
  /* Tint Esri's dark gray canvas toward the site's navy: river dark, land slate */
  .wind-map .leaflet-tile-pane { filter: sepia(0.5) hue-rotate(170deg) saturate(1.8) brightness(1.05) contrast(1.1); }
  .wind-map.leaflet-container { background: #0d2233; font-family: 'Inter', system-ui, sans-serif; }
  .wind-map .leaflet-control-attribution {
    background: rgba(11, 30, 45, 0.75);
    color: var(--mist);
    font-size: 9px;
  }
  .wind-map .leaflet-control-attribution a { color: var(--mist); }
  .tbc-label {
    background: none;
    border: 0;
    box-shadow: none;
    color: var(--fog);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 0;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  }
  .tbc-label::before { display: none; }

  .map-overlay {
    position: absolute;
    left: 12px;
    bottom: 46px;   /* clear of the map credits strip, which can wrap to two lines */
    z-index: 3;
    background: rgba(11, 30, 45, 0.82);
    border: 1px solid rgba(116, 176, 218, 0.35);
    border-radius: 8px;
    padding: 10px 12px;
    backdrop-filter: blur(3px);
    pointer-events: none;
    min-width: 150px;
  }
  .map-overlay .stat-value { font-size: 30px; margin-top: 2px; }
  .map-overlay .stat-detail { font-size: 12px; }

  /* Location / time toggles */
  .toggles {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin: 18px 0 0;
  }
  .seg { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .seg button {
    font: 600 11px/1 'Inter', system-ui, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mist);
    background: var(--ink-2);
    border: 1px solid rgba(116, 176, 218, 0.28);
    border-radius: 999px;
    padding: 8px 13px;
    cursor: pointer;
  }
  .seg button:hover { color: var(--fog); border-color: rgba(116, 176, 218, 0.6); }
  .seg button[aria-pressed="true"] { background: var(--dawn); border-color: var(--dawn); color: var(--ink); }
  .seg button:focus-visible { outline: 2px solid var(--fog); outline-offset: 2px; }

  /* Race course rating */
  .course.fast { color: var(--go); }
  .course.slow { color: var(--stop); }
  .course.typical { color: var(--dawn); }
  .rows .v .course { font-weight: 600; letter-spacing: 0.04em; }

  /* Storm / front callouts */
  .flags { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .flags:empty { display: none; }
  .flag {
    border-left: 3px solid var(--partial);
    background: rgba(255, 165, 0, 0.1);
    color: var(--fog);
    font-size: 13px;
    line-height: 1.45;
    padding: 8px 12px;
    border-radius: 0 6px 6px 0;
  }
  .flag strong { color: var(--partial); font-weight: 600; }

  /* ---------- 5-day forecast ---------- */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dawn);
    text-align: center;
    margin: 28px 0 12px;
  }

  .forecast { display: grid; grid-template-columns: 1fr; gap: 12px; }

  .day {
    background: var(--ink-2);
    border-radius: 12px;
    border-top: 3px solid var(--mist);
    padding: 14px 14px 12px;
    min-width: 0;
  }
  .day.has-flag { border-top-color: var(--partial); }

  .day-head { display: flex; justify-content: space-between; align-items: baseline; }
  .day-name {
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-size: 26px;
    letter-spacing: 0.03em;
    color: var(--fog);
  }
  .day-date { font-size: 12px; color: var(--mist); }

  .rows { list-style: none; margin: 8px 0 0; padding: 0; }
  .rows li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    padding: 5px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .rows li:first-child { border-top: 0; }
  .rows .k { color: var(--mist); flex: none; }
  .rows .v { color: var(--fog); text-align: right; font-weight: 500; min-width: 0; }
  .rows .v small { display: block; font-weight: 400; color: var(--mist); font-size: 11px; }

  .day .flags { margin-top: 10px; }
  .day .flag { font-size: 12px; padding: 6px 10px; }

  .note {
    text-align: center;
    font-size: 12px;
    color: var(--mist);
    margin-top: 24px;
    line-height: 1.6;
  }
  .note.error { color: var(--stop); }
  .note a { color: var(--mist); }

  @media (min-width: 560px) {
    header, .horizon, main { max-width: 960px; }
    .today-card { padding: 36px 32px 32px; }
    .label, .date { font-size: 22px; }
    .window-note { font-size: 14px; }
    .stat-value { font-size: 44px; }
    .forecast { grid-template-columns: repeat(2, 1fr); }

    /* Tablet: four boxes in a 2x2, map full width underneath */
    .today-grid {
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "temp course" "precip flow" "map map";
      gap: 14px;
      margin-top: 26px;
    }
    .box { padding: 18px 18px 16px; }
    .box-map { min-height: 380px; padding: 0; }
  }

  @media (min-width: 900px) {
    /* Desktop: matches the sketch, map tall on the right */
    .today-grid {
      grid-template-columns: 1fr 1fr 1.25fr;
      grid-template-areas: "temp course map" "precip flow map";
    }
    .box-map { min-height: 460px; }
    .forecast { grid-template-columns: repeat(5, 1fr); }
    .rows li { flex-direction: column; gap: 0; }
    .rows .v { text-align: left; }
  }
</style>
</head>
<body>

  <header>
    <p class="eyebrow">Whitman Rowing</p>
    <h1>PRACTICE WEATHER</h1>
    <p class="sub" id="subtitle">Georgetown waterfront &middot; 3&ndash;6 PM Eastern</p>
  </header>

  <nav class="toggles" aria-label="Choose location and practice time">
    <div class="seg" role="group" aria-label="Location" id="seg-loc"></div>
    <div class="seg" role="group" aria-label="Practice time" id="seg-time"></div>
  </nav>

  <div class="horizon" aria-hidden="true"></div>

  <main>
    <section class="today-card" id="today-card" aria-live="polite">
      <div class="card-head">
        <span class="label">Today</span>
        <span class="date" id="today-date"></span>
        <span class="window-note" id="today-window-note"></span>
      </div>
      <div class="today-grid">
        <div class="box box-temp" id="box-temp"></div>
        <div class="box box-precip" id="box-precip"></div>
        <div class="box box-map">
          <div class="wind-map" id="wind-map" role="img" aria-label="Map of the practice area with animated wind"></div>
          <canvas class="wind-canvas" id="wind-canvas" aria-hidden="true"></canvas>
          <div class="map-overlay" id="map-overlay"></div>
        </div>
        <div class="box box-course" id="box-course"></div>
        <div class="box box-flow" id="box-flow"></div>
      </div>
    </section>

    <h2 class="section-title" id="days-title">Next 5 days &middot; 3&ndash;6 PM</h2>
    <div class="forecast" id="forecast"></div>

    <p class="note" id="note">Loading forecast&hellip;</p>
  </main>

<script>
  // ---------------------------------------------------------------
  // CONFIG
  // ---------------------------------------------------------------
  const TZ = 'America/New_York';
  const FORECAST_DAYS = 5;
  const REFRESH_MINUTES = 15;

  // Practice windows (decimal hours, Eastern)
  const TIMES = {
    morning:   { label: 'Morning',   start: 5.5, end: 7.5,  text: '5:30&ndash;7:30 AM' },
    afternoon: { label: 'Afternoon', start: 15,  end: 18,   text: '3&ndash;6 PM' },
    evening:   { label: 'Evening',   start: 17.5, end: 19.5, text: '5:30&ndash;7:30 PM' }
  };

  // Median monthly flow, Jan..Dec, cfs (1996–2025)
  const LITTLE_FALLS_MEDIAN = [12360, 14360, 19020, 16890, 17505, 8733, 3823, 3156, 2518, 4177, 5073, 8492];
  // Northeast Branch (01649500) + Northwest Branch (01651000 record) combined
  const ANACOSTIA_MEDIAN = [148, 179, 187, 163, 138, 129, 102, 95, 82, 123, 94, 159];

  // Each location: weather point, tide station, river gauges, 2000 m course
  // (start/finish only set direction), and how the course model behaves there.
  //   sense:       +1 = course rows downstream, -1 = upstream, 0 = no current
  //   channelArea: river cross-section (m²); bigger = flow moves the water less
  //   tidePeak:    tidal current at mid-ebb / mid-flood (m/s)
  const LOCATIONS = {
    upper: {
      label: 'Upper Potomac', place: 'Georgetown waterfront',
      lat: 38.9015, lon: -77.0600,
      tide: { id: '8594900', name: 'Washington, DC' },
      flow: { sites: ['01646500'], name: 'USGS Little Falls', nwps: 'BRKM2', median: LITTLE_FALLS_MEDIAN },
      course: { start: [38.903394617433456, -77.08442775640597], finish: [38.8999463567322, -77.0613538203245],
                sense: 1, channelArea: 1800, tidePeak: 0.15 },
      markers: [
        [[38.900527, -77.0583371], 'Thompson Boat Center', 'left', [-6, 0]],
        [[38.9041311, -77.0701648], 'Potomac Boat Club', 'top', [0, -6]]
      ],
      // Thompson's on the right, a bit above middle, about 2.4 km of river to its left
      frame: { anchor: [38.900527, -77.0583371], fx: 0.8, fy: 0.38, meters: 2400 }
    },
    lower: {
      label: 'Lower Potomac', place: 'Dee Campbell Rowing Center, Alexandria',
      lat: 38.8121, lon: -77.0379,
      tide: { id: '8634214', name: 'Alexandria, VA' },
      flow: { sites: ['01646500'], name: 'USGS Little Falls', nwps: 'BRKM2', median: LITTLE_FALLS_MEDIAN },
      // Wide, deep river here: flow barely moves the water, tide does most of it
      course: { start: [38.79928976829386, -77.03877487397294], finish: [38.8118342155035, -77.0369929878263],
                sense: -1, channelArea: 9000, tidePeak: 0.25 },
      markers: [[[38.8120961, -77.0378564], 'Dee Campbell Rowing Center', 'left', [-6, 0]]],
      // Map center and how many meters show across the box
      view: { center: [38.8045, -77.0435], width: 4000 }
    },
    anacostia: {
      label: 'Anacostia', place: 'Anacostia Community Boathouse',
      lat: 38.8786, lon: -76.9756,
      tide: { id: '8593005', name: 'Washington Navy Yard' },
      flow: { sites: ['01649500', '01651003'], name: 'USGS NE + NW Branch', nwps: null, median: ANACOSTIA_MEDIAN },
      // Very little river flow; tide is effectively the whole current
      course: { start: [38.86922707532398, -76.9943412213138], finish: [38.87751302674171, -76.9742139242965],
                sense: -1, channelArea: 1500, tidePeak: 0.12 },
      markers: [[[38.8785995, -76.9756351], 'Anacostia Community Boathouse', 'top', [0, -6]]],
      view: { center: [38.8735, -76.9790], width: 3400 }
    },
    occoquan: {
      label: 'Occoquan', place: 'Sandy Run Regional Park',
      lat: 38.7103, lon: -77.3039,
      tide: null,      // reservoir: no tides
      flow: null,      // no live gauge for water over the dam; rain is used as a signal instead
      spill: true,
      course: { start: [38.695410019858926, -77.27719178455584], finish: [38.70470908066666, -77.29828234994132],
                sense: 0, channelArea: Infinity, tidePeak: 0 },
      markers: [
        [[38.7103173, -77.3039037], 'Sandy Run Regional Park', 'top', [0, -6]],
        [[38.6966835, -77.3178062], 'Oxford Boathouse', 'right', [6, 0]]
      ],
      view: { center: [38.7020, -77.2985], width: 4600 }
    }
  };

  // Rain over the 3 days before practice that suggests the Occoquan dam may be spilling
  const SPILL_RAIN_INCHES = 1.0;

  // Course model. Physics-based estimates, not yet calibrated to race results.
  const MODEL = {
    boatSpeed: 2000 / 375, // m/s: an eight rowing 6:15 for 2K in flat, calm water
    aeroShare: 0.08,       // share of a crew's effort spent pushing through still air
    crossFree: 8,          // mph of crosswind before it starts costing time
    crossCost: 0.4,        // seconds per mph of crosswind above that
    gustFree: 20,          // mph peak gust before chop starts costing time
    gustCost: 0.3,         // seconds per mph of gust above that
    band: 1.25             // seconds per 500 m either side of a typical day that still counts as Typical
  };
  const COURSE_METERS = 2000;
  // ---------------------------------------------------------------

  // ---------- Time helpers (everything is pinned to Eastern) ----------

  const etParts = (ms) => {
    const p = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, hourCycle: 'h23',
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    }).formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
    return p;
  };
  const etKey = (ms) => { const p = etParts(ms); return `${p.year}-${p.month}-${p.day}`; };
  const etStamp = (ms) => { const p = etParts(ms); return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`; };
  const addDays = (key, n) => {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  };
  // Eastern wall-clock time on a date -> UTC ms (hours may be decimal)
  const etToMs = (key, hours) => {
    const h = Math.floor(hours), min = Math.round((hours - h) * 60);
    const [y, m, d] = key.split('-').map(Number);
    const guess = Date.UTC(y, m - 1, d, h, min);
    const p = etParts(guess);
    const asIfUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    return guess + (guess - asIfUtc);
  };
  const dayLabel = (key, opts) => new Date(key + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', ...opts });
  // "15:31" -> "3:31 PM"
  const clock = (hhmm) => {
    let [h, m] = hhmm.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2, '0')} ${ap}`;
  };
  // 17.5 -> "17:30"
  const hhmm = (hours) => `${String(Math.floor(hours)).padStart(2, '0')}:${String(Math.round((hours % 1) * 60)).padStart(2, '0')}`;
  // 17.5 -> "5:30 PM", 15 -> "3 PM"
  const hourLabel = (hours) => clock(hhmm(hours)).replace(':00', '');

  // ---------- Small math helpers ----------

  const avg = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  const max = (a) => a.length ? Math.max(...a) : null;
  const clean = (a) => a.filter(x => typeof x === 'number' && !isNaN(x));
  const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  const compass = (deg) => COMPASS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
  // Vector average of wind direction, weighted by speed
  const avgDirection = (dirs, speeds) => {
    let x = 0, y = 0;
    dirs.forEach((d, i) => { const w = speeds[i] || 0.1; x += Math.sin(d * Math.PI / 180) * w; y += Math.cos(d * Math.PI / 180) * w; });
    if (!x && !y) return null;
    return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
  };
  const angleDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  const uvLabel = (uv) => uv < 3 ? 'Low' : uv < 6 ? 'Moderate' : uv < 8 ? 'High' : uv < 11 ? 'Very high' : 'Extreme';
  const fmtInt = (n) => Math.round(n).toLocaleString('en-US');
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const toRad = (d) => d * Math.PI / 180;

  const bearing = ([lat1, lon1], [lat2, lon2]) => {
    const [la1, lo1, la2, lo2] = [lat1, lon1, lat2, lon2].map(toRad);
    const y = Math.sin(lo2 - lo1) * Math.cos(la2);
    const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(lo2 - lo1);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  };

  // ---------- Data sources ----------

  async function getJSON(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status + ' from ' + new URL(url).host);
    return r.json();
  }

  // Hourly weather plus sunrise/sunset (Open-Meteo, which blends NOAA models for
  // the US). Includes the past 3 days so recent rain can be totaled.
  function loadWeather(loc) {
    const vars = 'temperature_2m,precipitation_probability,precipitation,uv_index,wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code';
    return getJSON('https://api.open-meteo.com/v1/forecast'
      + `?latitude=${loc.lat}&longitude=${loc.lon}&hourly=${vars}&daily=sunrise,sunset`
      + '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch'
      + `&timezone=${encodeURIComponent(TZ)}&past_days=3&forecast_days=${FORECAST_DAYS + 1}`);
  }

  // High/low tide predictions (NOAA CO-OPS), local time
  function loadTides(loc, todayKey) {
    if (!loc.tide) return Promise.resolve(null);
    const start = addDays(todayKey, -1).replace(/-/g, '');
    const end = addDays(todayKey, FORECAST_DAYS + 1).replace(/-/g, '');
    return getJSON('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter'
      + `?product=predictions&station=${loc.tide.id}&begin_date=${start}&end_date=${end}`
      + '&datum=MLLW&interval=hilo&units=english&time_zone=lst_ldt&format=json&application=dcrowingweather');
  }

  // Latest river flow, summed across the location's gauges
  async function loadRiverNow(loc) {
    if (!loc.flow) return null;
    const one = async (site) => {
      try {
        const j = await getJSON('https://api.waterdata.usgs.gov/ogcapi/v0/collections/latest-continuous/items'
          + `?f=json&monitoring_location_id=USGS-${site}&parameter_code=00060`);
        const p = j.features[0].properties;
        if (p.value == null) throw new Error('no value');
        return { cfs: Number(p.value), ms: Date.parse(p.time) };
      } catch (e) {
        const j = await getJSON('https://waterservices.usgs.gov/nwis/iv/'
          + `?format=json&sites=${site}&parameterCd=00060&siteStatus=all`);
        const v = j.value.timeSeries[0].values[0].value.slice(-1)[0];
        return { cfs: Number(v.value), ms: Date.parse(v.dateTime) };
      }
    };
    const readings = await Promise.all(loc.flow.sites.map(one));
    return { cfs: readings.reduce((s, r) => s + r.cfs, 0), ms: Math.min(...readings.map(r => r.ms)) };
  }

  // River flow forecast (NWS via NWPS), where one exists
  async function loadRiverForecast(loc) {
    if (!loc.flow || !loc.flow.nwps) return [];
    const j = await getJSON(`https://api.water.noaa.gov/nwps/v1/gauges/${loc.flow.nwps}/stageflow`);
    const toCfs = (pt, units) => units === 'kcfs' ? pt.secondary * 1000 : pt.secondary;
    return (j.forecast && j.forecast.data || [])
      .filter(pt => typeof pt.secondary === 'number' && pt.secondary >= 0)
      .map(pt => ({ ms: Date.parse(pt.validTime), cfs: toCfs(pt, j.forecast.secondaryUnits) }))
      .sort((a, b) => a.ms - b.ms);
  }

  // NWS text forecast + active alerts, for the storm / front notes
  async function loadNws(loc) {
    const point = await getJSON(`https://api.weather.gov/points/${loc.lat},${loc.lon}`);
    const [fc, alerts] = await Promise.all([
      getJSON(point.properties.forecast),
      getJSON(`https://api.weather.gov/alerts/active?point=${loc.lat},${loc.lon}`).catch(() => ({ features: [] }))
    ]);
    return { periods: fc.properties.periods, alerts: alerts.features || [] };
  }

  // ---------- Per-day summaries ----------

  // Index into the hourly arrays for a local time on a date (decimal; -1 if missing)
  function hourIndex(wx, key, hours) {
    const i = wx.hourly.time.indexOf(`${key}T${String(Math.floor(hours)).padStart(2, '0')}:00`);
    return i < 0 ? -1 : i + (hours % 1);
  }
  // Value at a (possibly fractional) index, interpolating between hours
  function valueAt(arr, fi) {
    const i = Math.floor(fi), f = fi - i;
    const a = arr[i], b = arr[i + 1];
    if (typeof a !== 'number') return null;
    if (!f || typeof b !== 'number') return a;
    return a + (b - a) * f;
  }

  // Window averages, sampled every 30 minutes. Rain amount is the total over
  // the window (each hourly value is the rain in the hour before it).
  function summarizeWeather(wx, key, T) {
    const h = wx.hourly;
    const samples = [];
    for (let t = T.start; t <= T.end + 1e-9; t += 0.5) {
      const fi = hourIndex(wx, key, t);
      if (fi >= 0) samples.push(fi);
    }
    if (!samples.length) return null;
    const pick = (name) => clean(samples.map(fi => valueAt(h[name], fi)));
    const pickNearest = (name) => clean(samples.map(fi => h[name][Math.round(fi)]));

    const temps = pick('temperature_2m');
    const speeds = pick('wind_speed_10m');
    const dirs = pickNearest('wind_direction_10m');
    const codes = pickNearest('weather_code');

    // Rain inside the window: overlap of each hour [H-1, H] with [start, end]
    let rain = 0;
    for (let H = Math.floor(T.start) + 1; H <= Math.ceil(T.end); H++) {
      const i = hourIndex(wx, key, H);
      if (i < 0) continue;
      const overlap = Math.max(0, Math.min(H, T.end) - Math.max(H - 1, T.start));
      rain += (h.precipitation[i] || 0) * overlap;
    }

    // Rain in the 72 hours before practice (Occoquan dam spill signal)
    const startIdx = Math.floor(hourIndex(wx, key, T.start));
    let rain72 = null;
    if (startIdx >= 72) rain72 = h.precipitation.slice(startIdx - 72, startIdx).reduce((s, x) => s + (x || 0), 0);

    const di = wx.daily.time.indexOf(key);
    return {
      temp: avg(temps), tempFirst: temps[0], tempLast: temps[temps.length - 1],
      precipChance: max(pick('precipitation_probability')),
      precipAmount: rain,
      rain72,
      uv: avg(pick('uv_index')),
      wind: avg(speeds),
      gust: max(pick('wind_gusts_10m')),
      dir: avgDirection(dirs, speeds),
      dirFirst: dirs[0], dirLast: dirs[dirs.length - 1],
      speedFirst: speeds[0], speedLast: speeds[speeds.length - 1],
      thunder: codes.some(c => c >= 95),
      heavyRain: codes.some(c => c === 65 || c === 82),
      sunrise: di >= 0 ? wx.daily.sunrise[di].slice(11) : null,
      sunset: di >= 0 ? wx.daily.sunset[di].slice(11) : null
    };
  }

  // Sun times (UTC ms) when the sun's center is at altitude h0 degrees, from the
  // standard sunrise equation. -0.833 = sunrise/sunset, -6 = civil twilight.
  function sunTimes(key, lat, lon, h0) {
    const r = Math.PI / 180;
    const [y, m, d] = key.split('-').map(Number);
    const jd = Date.UTC(y, m - 1, d, 12) / 86400000 + 2440587.5;
    const n = Math.floor(jd - 2451545.0 + 0.0008);   // whole days since J2000 at this date's noon
    const Jstar = n - lon / 360;
    const M = (357.5291 + 0.98560028 * Jstar) % 360;
    const C = 1.9148 * Math.sin(M * r) + 0.02 * Math.sin(2 * M * r) + 0.0003 * Math.sin(3 * M * r);
    const lam = (M + C + 180 + 102.9372) % 360;
    const Jt = 2451545.0 + Jstar + 0.0053 * Math.sin(M * r) - 0.0069 * Math.sin(2 * lam * r);
    const dec = Math.asin(Math.sin(lam * r) * Math.sin(23.4397 * r));
    const cosW = (Math.sin(h0 * r) - Math.sin(lat * r) * Math.sin(dec)) / (Math.cos(lat * r) * Math.cos(dec));
    if (cosW < -1 || cosW > 1) return null;
    const w = Math.acos(cosW) / r;
    const ms = (j) => (j - 2440587.5) * 86400000;
    return { rise: ms(Jt - w / 360), set: ms(Jt + w / 360) };
  }

  // Daylight during the window. "Dark" is civil twilight (sun 6° below the
  // horizon), when there's no longer enough natural light to see well, not
  // sunrise/sunset. Sunrise/sunset is the main figure, with first/last light
  // under it; afternoons only when last light comes before practice ends (winter).
  function lightFor(key, loc, T, timeKey) {
    const sun = sunTimes(key, loc.lat, loc.lon, -0.833), civ = sunTimes(key, loc.lat, loc.lon, -6);
    if (!sun || !civ) return null;
    const t = (ms) => clock(etStamp(ms).slice(11));
    const winS = etToMs(key, T.start), winE = etToMs(key, T.end);
    if (timeKey === 'morning') {
      const dawn = civ.rise;
      const note = dawn >= winE ? 'Dark the whole window' : dawn > winS ? `Dark until ${t(dawn)}` : 'Light the whole window';
      return { label: 'Sunrise', time: t(sun.rise), sub: `First light ${t(dawn)}`, note };
    }
    if (timeKey === 'evening' || civ.set < winE) {
      const dusk = civ.set;
      const note = dusk <= winS ? 'Dark the whole window' : dusk < winE ? `Dark after ${t(dusk)}` : 'Light the whole window';
      return { label: 'Sunset', time: t(sun.set), sub: `Last light ${t(dusk)}`, note };
    }
    return null;
  }

  // Which way the water moves during practice. Rising = flood (upstream),
  // falling = ebb (downstream).
  function summarizeTide(tides, key, T) {
    const ev = tides.map(t => ({ stamp: t.t, type: t.type }));
    const start = `${key} ${hhmm(T.start)}`, end = `${key} ${hhmm(T.end)}`;
    const next = ev.find(e => e.stamp >= start);
    if (!next) return null;
    const turns = ev.filter(e => e.stamp >= start && e.stamp <= end);
    const rising = next.type === 'H';
    const name = (e) => (e.type === 'H' ? 'High' : 'Low');
    const sameDay = next.stamp.slice(0, 10) === key;
    const when = clock(next.stamp.slice(11)) + (sameDay ? '' : ' ' + dayLabel(next.stamp.slice(0, 10), { weekday: 'short' }));
    let flow;
    if (!turns.length) flow = rising ? 'Rising (incoming) all practice' : 'Falling (outgoing) all practice';
    else {
      flow = (rising ? 'Rising' : 'Falling') + ' until ' + clock(turns[0].stamp.slice(11)) + ', then ' + (rising ? 'falling' : 'rising');
      if (turns.length > 1) flow += ' again';
    }
    return { headline: `${name(next)} @ ${when}`, short: name(next) + ' ' + when, flow };
  }

  // Tide push during practice: -1 (mid-flood) to +1 (mid-ebb), strongest
  // halfway between a high and a low, near zero at the turn.
  function tideFactor(tides, key, T) {
    const mins = (stamp) => Date.parse(stamp.replace(' ', 'T') + 'Z') / 60000;
    const ev = tides.map(t => ({ m: mins(t.t), type: t.type }));
    const samples = [];
    for (let h = T.start * 60; h <= T.end * 60; h += 15) {
      const m = mins(`${key} ${hhmm(h / 60)}`);
      const prev = [...ev].reverse().find(e => e.m <= m), next = ev.find(e => e.m > m);
      if (!prev || !next) continue;
      const frac = (m - prev.m) / (next.m - prev.m);
      samples.push((next.type === 'L' ? 1 : -1) * Math.sin(Math.PI * frac));
    }
    return samples.length ? avg(samples) : null;
  }

  // River forecast interpolated to a moment (6 hours of slack past either end)
  function riverAt(points, ms) {
    if (!points.length) return null;
    if (ms < points[0].ms || ms > points[points.length - 1].ms) {
      const nearest = ms < points[0].ms ? points[0] : points[points.length - 1];
      return Math.abs(nearest.ms - ms) <= 6 * 3600e3 ? nearest.cfs : null;
    }
    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1], b = points[i];
      if (ms <= b.ms) return a.cfs + (b.cfs - a.cfs) * (ms - a.ms) / (b.ms - a.ms || 1);
    }
    return null;
  }

  // Storm / front / dam notes for a day's window
  function flagsFor(key, w, nws, T, loc) {
    const flags = [];
    const winStart = etToMs(key, T.start), winEnd = etToMs(key, T.end);

    if (nws) {
      nws.alerts.forEach(a => {
        const p = a.properties;
        const on = Date.parse(p.onset || p.effective), off = Date.parse(p.ends || p.expires);
        if (on <= winEnd && (isNaN(off) || off >= winStart)) flags.push(`<strong>${esc(p.event)}</strong> in effect`);
      });
      // NWS text forecast periods that overlap the window
      const hits = [];
      nws.periods.forEach(p => {
        if (Date.parse(p.startTime) > winEnd || Date.parse(p.endTime) < winStart) return;
        p.detailedForecast.split(/(?<=\.)\s+/)
          .filter(s => /thunder|severe|cold front|warm front|\bfront\b|strong storm|damaging/i.test(s))
          .forEach(s => { if (!hits.includes(s)) hits.push(s); });
      });
      if (hits.length) flags.push(`<strong>NWS:</strong> ${esc(hits.join(' '))}`);
    }

    if (w) {
      if (w.thunder) flags.push(`<strong>Thunderstorms</strong> in the model forecast for ${T.text}`);
      else if (w.heavyRain) flags.push(`<strong>Heavy rain</strong> in the model forecast for ${T.text}`);
      const drop = w.tempFirst - w.tempLast;
      const shift = (w.dirFirst != null && w.dirLast != null) ? angleDiff(w.dirFirst, w.dirLast) : 0;
      if (drop >= 7) {
        flags.push(`<strong>Possible front:</strong> temperature drops about ${Math.round(drop)}&deg; during practice`);
      } else if (shift >= 90 && w.speedLast >= 8 && w.speedLast > w.speedFirst) {
        flags.push(`<strong>Possible front:</strong> wind shifts to ${compass(w.dirLast)} and picks up to ${Math.round(w.speedLast)} mph`);
      }
      if (loc.spill && w.rain72 != null && w.rain72 >= SPILL_RAIN_INCHES) {
        flags.push(`<strong>Dam may be spilling:</strong> about ${w.rain72.toFixed(1)} in of rain in the 3 days before practice`);
      }
    }
    return flags;
  }

  // ---------- Race course model ----------

  // Boat speed through the water (m/s) with a wind component along the course
  // (m/s, positive = tailwind), holding the crew's power constant.
  function boatSpeed(windAlong) {
    const v0 = MODEL.boatSpeed, a = MODEL.aeroShare, w = windAlong / v0;
    const power = (x) => (1 - a) * x ** 3 + a * x * (x - w) * Math.abs(x - w);
    let lo = 0.5, hi = 1.6;
    for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (power(mid) < 1) lo = mid; else hi = mid; }
    return v0 * (lo + hi) / 2;
  }

  // Seconds for the course. Downstream current (river flow plus ebb) is
  // positive; `sense` turns that into help (+1, downstream course) or
  // hindrance (-1, upstream course).
  function courseSeconds(c, { windAlong = 0, cross = 0, gust = 0, flow = 0, tide = 0 }) {
    const downstream = (flow / 35.3147) / c.channelArea + c.tidePeak * tide;
    let t = COURSE_METERS / (boatSpeed(windAlong) + c.sense * downstream);
    t += Math.max(0, cross - MODEL.crossFree) * MODEL.crossCost;
    t += Math.max(0, gust - MODEL.gustFree) * MODEL.gustCost;
    return t;
  }

  // Fast / Typical / Slow versus a typical day at this location this month
  function coursePrediction(loc, w, tide, flow, key) {
    if (!w || w.dir == null) return null;
    const c = { ...loc.course, heading: bearing(loc.course.start, loc.course.finish) };
    const month = Number(key.slice(5, 7));
    const median = loc.flow ? loc.flow.median[month - 1] : 0;
    const q = loc.flow ? (flow != null ? flow : median) : 0;
    const tf = loc.tide && tide != null ? tide : 0;

    const rel = toRad((w.dir + 180) % 360 - c.heading);   // wind blows TOWARD dir+180
    const alongMph = w.wind * Math.cos(rel);
    const crossMph = Math.abs(w.wind * Math.sin(rel));
    const windMs = alongMph * 0.44704;
    const all = { windAlong: windMs, cross: crossMph, gust: w.gust, flow: q, tide: tf };

    const typical = courseSeconds(c, { flow: median });
    const diff = courseSeconds(c, all) - typical;

    const parts = [
      { s: courseSeconds(c, { windAlong: windMs, cross: crossMph, gust: w.gust, flow: median }) - typical,
        text: alongMph >= 1 ? `${Math.round(alongMph)} mph tailwind`
            : alongMph <= -1 ? `${Math.round(-alongMph)} mph headwind`
            : `${Math.round(crossMph)} mph crosswind` },
      { s: courseSeconds(c, { flow: median, tide: tf }) - typical, text: tf > 0 ? 'outgoing tide' : 'incoming tide' },
      { s: courseSeconds(c, { flow: q }) - typical, text: q >= median ? 'high flow' : 'low flow' }
    ].filter(p => Math.abs(p.s) >= 1.5).sort((a, b) => Math.abs(b.s) - Math.abs(a.s));
    // Dam spill can't be measured, so it's listed without changing the rating
    const spill = loc.spill && w.rain72 != null && w.rain72 >= SPILL_RAIN_INCHES;

    const perSplit = (d) => d * 500 / COURSE_METERS;
    const splitDiff = perSplit(diff);
    const label = splitDiff <= -MODEL.band ? 'FAST' : splitDiff >= MODEL.band ? 'SLOW' : 'TYPICAL';

    const flat = COURSE_METERS / MODEL.boatSpeed;
    const flatDiff = courseSeconds(c, all) - flat;
    const split = (d) => { const v = Math.abs(perSplit(d)); return v < 0.05 ? null : `${v.toFixed(1)} s/500 ${d < 0 ? 'faster' : 'slower'}`; };
    const monthLong = dayLabel(key, { month: 'long' }), monthShort = dayLabel(key, { month: 'short' });
    const hasCurrent = c.sense !== 0;

    const helps = parts.filter(p => p.s < 0).map(p => p.text);
    const hurts = parts.filter(p => p.s > 0).map(p => p.text).concat(spill ? ['possible dam spill'] : []);
    const why = [
      helps.length ? cap(helps.join(', ')) + ' help' + (helps.length === 1 ? 's' : '') : '',
      hurts.length ? (helps.length ? hurts.join(', ') : cap(hurts.join(', '))) + ' slow' + (hurts.length === 1 ? 's' : '') + ' it' : ''
    ].filter(Boolean).join('; ') || 'Close to normal conditions';

    // Day boxes: one sentence. With no current, "typical" is flatwater.
    const vs = split(diff)
      ? `${split(diff)} than ${hasCurrent ? `a typical ${monthLong} day` : 'flatwater, calm'}`
      : (hasCurrent ? 'About the same as a typical day' : 'About the same as flatwater, calm');

    return {
      label, cls: label.toLowerCase(), vs, why, hasCurrent,
      kind: c.sense > 0 ? 'Downstream 2K' : c.sense < 0 ? 'Upstream 2K' : '2K',
      short: {
        month: monthShort,
        vsTypical: split(diff) || 'Even',
        vsFlat: split(flatDiff) || 'Even',
        helping: helps.map(cap).join('<br>'),
        slowing: hurts.map(cap).join('<br>')
      }
    };
  }

  // ---------- Rendering ----------

  // Arrow points the way the wind is blowing TO (downwind)
  const arrowSvg = (fromDeg) =>
    `<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(${(fromDeg + 180) % 360}deg)">`
    + '<path d="M12 2 L19 20 L12 16 L5 20 Z" fill="currentColor"/></svg>';
  const DASH = '&mdash;';
  const metric = (label, value, detail = '') =>
    `<div class="metric"><span class="stat-label">${label}</span>`
    + `<span class="stat-value">${value}</span>`
    + (detail ? `<span class="stat-detail">${detail}</span>` : '') + '</div>';

  function renderToday(loc, T, d, riverNow) {
    const { w, tide, river, course, flags, light } = d;
    const set = (id, html) => { document.getElementById(id).innerHTML = html; };

    // Temp & UV (+ sunrise / sunset)
    set('box-temp', `<span class="box-title">Temp &amp; UV${light ? ' &middot; Light' : ''}</span><div class="pair">`
      + metric('Temperature', w ? `${Math.round(w.temp)}<span class="unit">&deg;F</span>` : DASH,
          w ? `${Math.round(w.tempFirst)}&deg; at ${hourLabel(T.start)} &rarr; ${Math.round(w.tempLast)}&deg; at ${hourLabel(T.end)}` : '')
      + metric('UV Index', w ? `${Math.round(w.uv)}` : DASH, w ? uvLabel(w.uv) : '')
      + (light ? metric(light.label, light.time.replace(/ (AM|PM)/, '<span class="unit">$1</span>'), light.sub) : '')
      + '</div>');

    // Precipitation & advisories
    document.getElementById('box-precip').classList.toggle('has-flag', flags.length > 0);
    set('box-precip', '<span class="box-title">Precipitation &amp; Advisories</span>'
      + metric('Chance of Rain', w ? `${Math.round(w.precipChance)}<span class="unit">%</span>` : DASH,
          w ? (w.precipAmount >= 0.01 ? `About ${w.precipAmount.toFixed(2)} in, ${T.text}` : 'No measurable rain expected') : '')
      + (flags.length
          ? `<div class="flags">${flags.map(f => `<div class="flag">${f}</div>`).join('')}</div>`
          : `<span class="no-alerts">No NOAA advisories or storm signals for ${T.text}</span>`));

    // Race course
    const box = document.getElementById('box-course');
    box.classList.remove('is-fast', 'is-slow', 'is-typical');
    if (course) box.classList.add('is-' + course.cls);
    const fact = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
    set('box-course', '<span class="box-title">Race Course Conditions</span>'
      + metric(course ? course.kind : '2K', course ? `<span class="course ${course.cls}">${course.label}</span>` : DASH,
          course ? '' : 'Needs the wind forecast')
      + (course ? '<dl class="facts">'
          + (course.hasCurrent ? fact(`vs. typical ${course.short.month}`, course.short.vsTypical) : '')
          + fact(course.hasCurrent ? 'vs. flatwater' : 'vs. flatwater, calm', course.short.vsFlat)
          + (course.short.helping ? fact('Helping', course.short.helping) : '')
          + (course.short.slowing ? fact('Slowing', course.short.slowing) : '')
          + (!course.short.helping && !course.short.slowing ? fact('Conditions', 'Close to normal') : '')
          + '</dl>' : ''));

    // Tide & flow, or the reservoir for Occoquan
    if (loc.tide || loc.flow) {
      const mid = clock(hhmm((T.start + T.end) / 2));
      const riverDetail = riverNow
        ? `${loc.flow.name} &middot; ${clock(etStamp(riverNow.ms).slice(11))}`
          + (river != null ? `<br>Forecast ${mid}: ${fmtInt(river)}` : '')
        : (river != null ? `NWS forecast for ${mid}` : 'Unavailable');
      const riverValue = riverNow ? riverNow.cfs : river;
      set('box-flow', '<span class="box-title">Tide &amp; Flow</span><div class="pair">'
        + metric('Next Tide', tide ? tide.short : DASH, tide ? `${tide.flow}<br>NOAA ${loc.tide.name}` : 'Unavailable')
        + metric('River Flow', riverValue != null ? `${fmtInt(riverValue)}<span class="unit">cfs</span>` : DASH, riverDetail)
        + '</div>');
    } else {
      const r = w && w.rain72 != null ? w.rain72 : null;
      set('box-flow', '<span class="box-title">Reservoir</span><div class="pair">'
        + metric('Rain, last 3 days', r != null ? `${r.toFixed(1)}<span class="unit">in</span>` : DASH,
            r == null ? 'Unavailable'
              : r >= SPILL_RAIN_INCHES ? 'Heavy rain: the dam may be spilling, which can slow the course'
              : 'Not enough rain to expect water over the dam')
        + '</div><span class="no-alerts">No tides on the Occoquan Reservoir. There’s no live gauge for water over the dam, so recent rain is the signal.</span>');
    }

    // Map overlay + wind
    set('map-overlay', w && w.dir != null
      ? metric(`Wind, ${T.text}`, `${arrowSvg(w.dir)}${Math.round(w.wind)}<span class="unit">/</span>${Math.round(w.gust)}<span class="unit">mph</span>`,
          `Sustained ${Math.round(w.wind)} &middot; gusts ${Math.round(w.gust)}<br>From the ${compass(w.dir)} (${Math.round(w.dir)}&deg;)`)
      : metric('Wind', DASH, 'Unavailable'));
    WindMap.setWind(w && w.dir != null ? { dir: w.dir, mph: w.wind, gust: w.gust } : null);
  }

  // ---------- Map with windy.com-style wind streaks ----------
  const WindMap = (() => {
    let map = null, markerLayer = null, loc = null, canvas, ctx, particles = [], wind = null, w = 0, h = 0, dpr = 1;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Center and zoom for a location's map at a given box size
    function viewFor(l, bw, bh) {
      if (l.frame) {
        // Anchor a boathouse at a set spot in the frame (Georgetown)
        const f = l.frame;
        const metersPerPxAtZ0 = 156543.03 * Math.cos(f.anchor[0] * Math.PI / 180);
        const zoom = Math.min(17, Math.max(12.5, Math.log2((f.fx * bw * metersPerPxAtZ0) / f.meters)));
        const p = L.CRS.EPSG3857.latLngToPoint(L.latLng(f.anchor), zoom);
        const c = L.point(p.x - (f.fx - 0.5) * bw, p.y + (0.5 - f.fy) * bh);
        return { center: L.CRS.EPSG3857.pointToLatLng(c, zoom), zoom };
      }
      // Set center, zoomed so `width` meters fit across the box
      const v = l.view;
      const metersPerPxAtZ0 = 156543.03 * Math.cos(v.center[0] * Math.PI / 180);
      return { center: L.latLng(v.center), zoom: Math.min(16, Math.max(11, Math.log2((bw * metersPerPxAtZ0) / v.width))) };
    }

    function frame() {
      if (!map || !loc) return;
      const box = map.getContainer();
      const bw = box.clientWidth, bh = box.clientHeight;
      if (!bw || !bh) return;
      const v = viewFor(loc, bw, bh);
      map.setView(v.center, v.zoom, { animate: false });
    }

    // Download the map tiles other locations will need, so switching to one
    // shows a finished map instead of filling in piece by piece.
    const preloaded = new Map();
    function preloadTiles(locs) {
      if (!map) return;
      const box = map.getContainer();
      const bw = box.clientWidth, bh = box.clientHeight;
      if (!bw || !bh) return;
      locs.forEach(l => {
        const v = viewFor(l, bw, bh);
        const z = Math.min(16, Math.round(v.zoom));            // the tile level Leaflet will draw
        const s = Math.pow(2, v.zoom - z);
        const c = L.CRS.EPSG3857.latLngToPoint(v.center, z);
        const hw = bw / s / 2 + 256, hh = bh / s / 2 + 256;    // plus a tile of margin
        for (let x = Math.floor((c.x - hw) / 256); x <= Math.floor((c.x + hw) / 256); x++) {
          for (let y = Math.floor((c.y - hh) / 256); y <= Math.floor((c.y + hh) / 256); y++) {
            const url = `https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/${z}/${y}/${x}`;
            if (preloaded.has(url)) continue;
            const img = new Image();
            img.src = url;
            preloaded.set(url, img);
          }
        }
      });
    }

    function sizeCanvas() {
      const r = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      w = r.width; h = r.height;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed();
    }
    function seed() {
      const count = wind ? Math.round(Math.min(900, (w * h) / 900) * (0.5 + Math.min(wind.mph, 20) / 40)) : 0;
      particles = Array.from({ length: count }, () => spawn(true));
    }
    function spawn(anyAge) {
      return { x: Math.random() * w, y: Math.random() * h, age: anyAge ? Math.random() * 80 : 0, life: 50 + Math.random() * 60 };
    }
    function tick() {
      requestAnimationFrame(tick);
      if (!wind || !w) return;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
      const toward = (wind.dir + 180) * Math.PI / 180;
      const speed = (0.5 + Math.min(wind.mph, 30) * 0.14) * 0.75;   // px per frame
      const vx = Math.sin(toward) * speed, vy = -Math.cos(toward) * speed;
      const gustiness = Math.max(0, (wind.gust - wind.mph) / Math.max(wind.mph, 1));
      ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(230, 242, 252, 0.85)';
      ctx.beginPath();
      for (const p of particles) {
        const jitter = 1 + (Math.random() - 0.5) * 0.6 * Math.min(gustiness, 1);
        const nx = p.x + vx * jitter, ny = p.y + vy * jitter;
        ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny);
        p.x = nx; p.y = ny; p.age++;
        if (p.age > p.life || p.x < -5 || p.y < -5 || p.x > w + 5 || p.y > h + 5) Object.assign(p, spawn(false));
      }
      ctx.stroke();
    }
    function drawStatic() {
      ctx.clearRect(0, 0, w, h);
      if (!wind) return;
      const toward = (wind.dir + 180) * Math.PI / 180;
      ctx.strokeStyle = 'rgba(160, 205, 235, 0.7)'; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 1.5;
      for (let y = 30; y < h; y += 60) for (let x = 30; x < w; x += 60) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(toward);
        ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(0, -12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-5, -6); ctx.lineTo(5, -6); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    function init() {
      if (map || !window.L) return;
      map = L.map('wind-map', {
        zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
        boxZoom: false, keyboard: false, touchZoom: false, tap: false, zoomSnap: 0
      });
      L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, maxNativeZoom: 16,
        attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
      }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);
      canvas = document.getElementById('wind-canvas');
      ctx = canvas.getContext('2d');
      sizeCanvas();
      let t;
      const onResize = () => { clearTimeout(t); t = setTimeout(() => { map.invalidateSize(); frame(); sizeCanvas(); if (reduceMotion) drawStatic(); }, 150); };
      window.addEventListener('resize', onResize);
      if (window.ResizeObserver) new ResizeObserver(onResize).observe(map.getContainer());
      if (!reduceMotion) tick();
    }

    return {
      preloadTiles,
      setLocation(next) {
        init();
        if (!map || loc === next) return;
        loc = next;
        markerLayer.clearLayers();
        loc.markers.forEach(([pos, name, dir, offset]) => {
          L.circleMarker(pos, { radius: 5, color: '#0b1e2d', weight: 2, fillColor: '#74b0da', fillOpacity: 1 })
            .bindTooltip(name, { permanent: true, direction: dir, offset, className: 'tbc-label' })
            .addTo(markerLayer);
        });
        frame();
      },
      setWind(next) {
        init();
        wind = next;
        if (!canvas) return;
        seed();
        if (reduceMotion) drawStatic();
      }
    };
  })();

  function dayCard(loc, d) {
    const { key, w, tide, river, flags, course, riverHeld, light } = d;
    const row = (k, v, small = '') => `<li><span class="k">${k}</span><span class="v">${v}${small ? `<small>${small}</small>` : ''}</span></li>`;
    const riverRow = !loc.flow ? ''
      : river != null ? row('River', `${fmtInt(river)} cfs <span class="tag">fcst</span>`)
      : riverHeld != null ? row('River', `${fmtInt(riverHeld)} cfs`, 'Latest reading, no forecast')
      : row('River', DASH, 'No river forecast');
    return `<article class="day${flags.length ? ' has-flag' : ''}">
      <div class="day-head">
        <span class="day-name">${dayLabel(key, { weekday: 'long' })}</span>
        <span class="day-date">${dayLabel(key, { month: 'short', day: 'numeric' })}</span>
      </div>
      <ul class="rows">
        ${row('Temp', w ? `${Math.round(w.temp)}&deg;F` : DASH)}
        ${row('Precip', w ? `${Math.round(w.precipChance)}%` : DASH, w && w.precipAmount >= 0.01 ? `${w.precipAmount.toFixed(2)} in` : '')}
        ${row('UV', w ? `${Math.round(w.uv)} &middot; ${uvLabel(w.uv)}` : DASH)}
        ${light ? row(light.label, light.time, light.sub) : ''}
        ${row('Wind', w ? `${Math.round(w.wind)} mph` : DASH, w ? `gusts to ${Math.round(w.gust)}` : '')}
        ${row('Direction', w && w.dir != null ? `${compass(w.dir)} ${arrowSvg(w.dir)}` : DASH)}
        ${loc.tide ? row('Next tide', tide ? tide.headline : DASH, tide ? tide.flow : '') : ''}
        ${riverRow}
        ${row('Course', course ? `<span class="course ${course.cls}">${course.label}</span>` : DASH, course ? `${course.vs}. ${course.why}.` : '')}
      </ul>
      <div class="flags">${flags.map(f => `<div class="flag">${f}</div>`).join('')}</div>
    </article>`;
  }

  // ---------- State: location + time, kept in the link ----------

  const state = (() => {
    const q = new URLSearchParams(location.search);
    return {
      loc: LOCATIONS[q.get('loc')] ? q.get('loc') : 'upper',
      time: TIMES[q.get('time')] ? q.get('time') : 'afternoon'
    };
  })();

  function saveState() {
    const q = new URLSearchParams(location.search);
    q.set('loc', state.loc); q.set('time', state.time);
    history.replaceState(null, '', `${location.pathname}?${q.toString()}`);
  }

  function renderToggles() {
    const make = (id, items, current, onPick) => {
      const el = document.getElementById(id);
      el.innerHTML = Object.entries(items).map(([k, v]) =>
        `<button type="button" data-k="${k}" aria-pressed="${k === current}">${v.label}</button>`).join('');
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => onPick(b.dataset.k)));
    };
    make('seg-loc', LOCATIONS, state.loc, (k) => { if (k !== state.loc) { state.loc = k; saveState(); renderToggles(); run(); } });
    make('seg-time', TIMES, state.time, (k) => { if (k !== state.time) { state.time = k; saveState(); renderToggles(); run(); } });
  }

  // ---------- Main ----------

  // Data is cached per location for a few minutes, so switching the time (or
  // switching back to a location) doesn't refetch everything.
  const cache = {};
  function loadAll(locKey, todayKey) {
    const hit = cache[locKey];
    if (hit && hit.todayKey === todayKey && Date.now() - hit.at < 10 * 60e3) return hit.promise;
    const loc = LOCATIONS[locKey];
    const promise = Promise.allSettled([
      loadWeather(loc), loadTides(loc, todayKey), loadRiverNow(loc), loadRiverForecast(loc), loadNws(loc)
    ]).then(results => {
      results.forEach(r => { if (r.status === 'rejected') console.error(r.reason); });
      const val = (r) => r.status === 'fulfilled' ? r.value : null;
      return { wx: val(results[0]), tides: val(results[1]), riverNow: val(results[2]), riverFc: val(results[3]) || [], nws: val(results[4]) };
    });
    cache[locKey] = { at: Date.now(), todayKey, promise };
    return promise;
  }

  // After the chosen location is on screen, load the other locations' data and
  // map tiles in the background so switching is instant.
  function prefetchOthers() {
    const todayKey = etKey(Date.now());
    const others = Object.keys(LOCATIONS).filter(k => k !== state.loc);
    others.forEach(k => loadAll(k, todayKey).catch(console.error));
    WindMap.preloadTiles(others.map(k => LOCATIONS[k]));   // already-fetched tiles are skipped
  }
  // A resize (e.g. rotating a phone) changes the zoom each map will use
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => WindMap.preloadTiles(Object.values(LOCATIONS)), 800);
  });

  let runId = 0;
  async function run(force) {
    const id = ++runId;
    const loc = LOCATIONS[state.loc], T = TIMES[state.time];
    const now = Date.now();
    const todayKey = etKey(now);
    if (force) delete cache[state.loc];

    document.getElementById('subtitle').innerHTML = `${loc.place} &middot; ${T.text} Eastern`;
    document.getElementById('days-title').innerHTML = `Next 5 days &middot; ${T.text}`;
    WindMap.setLocation(loc);

    const { wx, tides, riverNow, riverFc, nws } = await loadAll(state.loc, todayKey);
    if (id !== runId) return;   // a newer selection has started
    const tideList = tides && tides.predictions ? tides.predictions : null;
    const keys = Array.from({ length: FORECAST_DAYS + 1 }, (_, i) => addDays(todayKey, i));
    const midHours = (T.start + T.end) / 2;

    const days = keys.map((key, i) => {
      const w = wx ? summarizeWeather(wx, key, T) : null;
      const river = loc.flow ? riverAt(riverFc, etToMs(key, midHours)) : null;
      // Course flow: today's reading, else the forecast, else hold today's reading
      let courseFlow = river, riverHeld = null;
      if (i === 0 && riverNow) courseFlow = riverNow.cfs;
      else if (courseFlow == null && riverNow) { courseFlow = riverNow.cfs; riverHeld = riverNow.cfs; }
      return {
        key, w, river, riverHeld,
        light: lightFor(key, loc, T, state.time),
        tide: tideList ? summarizeTide(tideList, key, T) : null,
        course: coursePrediction(loc, w, tideList ? tideFactor(tideList, key, T) : null, courseFlow, key),
        flags: flagsFor(key, w, nws, T, loc)
      };
    });

    const t = days[0];
    document.getElementById('today-date').textContent = dayLabel(t.key, { weekday: 'long', month: 'long', day: 'numeric' });
    const nowStamp = etStamp(now);
    document.getElementById('today-window-note').textContent =
      nowStamp.slice(11) >= hhmm(T.end) ? `Today’s ${T.label.toLowerCase()} window has passed. Showing its forecast anyway.` : '';
    renderToday(loc, T, t, riverNow);
    document.getElementById('forecast').innerHTML = days.slice(1).map(d => dayCard(loc, d)).join('');

    // Footer
    const note = document.getElementById('note');
    const failed = [];
    if (!wx) failed.push('weather');
    if (loc.tide && !tideList) failed.push('tides');
    if (loc.flow && !riverNow && !riverFc.length) failed.push('river flow');
    if (!nws) failed.push('NWS storm alerts');
    const c = loc.course;
    const dir = c.sense > 0 ? 'downstream' : c.sense < 0 ? 'upstream' : 'on still water';
    note.classList.toggle('error', failed.length > 0);
    note.innerHTML = (failed.length ? `Couldn’t load ${failed.join(', ')} right now. ` : '')
      + `Updated ${clock(nowStamp.slice(11))}. Temperature, UV, sustained wind and direction are ${T.text} averages; gusts are the peak; rain chance is the highest hourly chance and rain amount is the window total.`
      + `<br>Race course: ${fmtInt(COURSE_METERS)} m ${dir}, heading ${compass(bearing(c.start, c.finish))}. `
      + (c.sense !== 0
          ? `Rated against a typical day for the month (median river flow, no wind, slack tide). `
          : `Rated on wind only, against flatwater with no wind. `)
      + `Splits are per 500 m for an eight; Fast or Slow means at least ${MODEL.band} s/500 different. These are estimates, not yet checked against race results.`
      + `<br>First and last light are civil twilight (sun 6&deg; below the horizon), when it gets too dark to see well on the water.`
      + `<br>Sources: Open-Meteo (NOAA models), NWS`
      + (loc.tide ? `, NOAA tide station ${loc.tide.id} (${loc.tide.name})` : '')
      + (loc.flow ? `, ${loc.flow.name} (${loc.flow.sites.join(' + ')})${loc.flow.nwps ? ' and NWS river forecast' : ''}` : '')
      + '.';
  }

  renderToggles();
  run().then(prefetchOthers).catch(err => {
    console.error(err);
    const note = document.getElementById('note');
    note.textContent = 'Could not load the forecast right now. Try refreshing.';
    note.classList.add('error');
  });

  // Keep a phone left open on this page current
  setInterval(() => run(true).then(prefetchOthers).catch(console.error), REFRESH_MINUTES * 60 * 1000);
</script>

</body>
</html>
